services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "kukdi"
      CORS_ORIGINS: "*"
      # Set this in a root .env file or your shell before `docker compose up`.
      EMERGENT_LLM_KEY: "${EMERGENT_LLM_KEY}"
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: "http://localhost:8001"
      WDS_SOCKET_PORT: "0"
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

volumes:
  mongo_data:
